name: Build Ben10 Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up old Gradle 2.14 (required by ForgeGradle 1.x)
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-2.14-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-2.14/bin" >> $GITHUB_PATH

      - name: Build mod jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: bin10mod-jar
          path: build/libs/*.jar
